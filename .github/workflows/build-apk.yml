name: Build & Publish Mr.Magistic APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Mr.Magistic"
  APP_ID: "com.nilanchala.mrmagistic"
  KEYSTORE_PASS: "ChangeThisStrongPassword123"
  KEY_ALIAS: "releasekey"
  ANDROID_HOME: "/usr/local/lib/android/sdk"
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Verify Android SDK and accept licenses
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name "sdkmanager" -type f | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Initialize Capacitor and sync www
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install -D @capacitor/cli
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Generate keystore and sign release APK
        run: |
          keytool -genkey -v -keystore release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=Mr.Magistic, OU=Dev, O=Nilanchala, L=Bhubaneswar, S=Odisha, C=IN"

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -v -p 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASS" \
            --key-pass "pass:$KEYSTORE_PASS" \
            --out app-release.apk \
            app-release-aligned.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mr.Magistic v1.0.${{ github.run_number }}
          make_latest: true
          files: app-release.apk
          
